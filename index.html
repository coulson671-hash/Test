<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geekster - Blind Test Aléatoire (Deezer Preview)</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #111; color: white; font-family: Arial, sans-serif; min-height: 100vh; }
        .container { width: 100%; max-width: 520px; margin: auto; padding: 16px; }
        header { text-align: center; margin-bottom: 14px; }
        .logo { font-size: 42px; font-weight: 900; letter-spacing: 5px; }
        .subtitle { color: #e50914; font-weight: bold; font-size: 14px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .panel { background: #202020; border-radius: 18px; padding: 20px; margin-top: 14px; text-align: center; }
        button { width: 100%; border: 0; border-radius: 14px; padding: 15px; margin-top: 10px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; background: #e50914; }
        button.secondary { background: #303030; }
        button.success { background: #28a745; }
        button.info { background: #17a2b8; }
        button.warning { background: #ffc107; color: black; }
        input[type="text"] { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: 1px solid #444; background: #303030; color: white; margin-bottom: 10px; }
        .game-title { font-size: 24px; font-weight: bold; color: #f5be32; }
        .music-title { color: #fff; margin-top: 10px; font-size: 20px; font-weight: bold; }
        .card-category { color: #e50914; margin-top: 6px; font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .feedback { margin-top: 15px; font-size: 18px; font-weight: bold; }
        .clues-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
        .team-score-box { background: #303030; padding: 10px; border-radius: 10px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">GEEKSTER</div>
            <div class="subtitle">🎵 BLIND TEST ALÉATOIRE (SANS PUB)</div>
        </header>

        <!-- 1. ACCUEIL : CHOIX DU MODE -->
        <section id="home" class="screen active">
            <div class="panel">
                <h2>Choisis ton mode de jeu</h2>
                <button onclick="setGameMode('solo')">👤 MODE SOLO</button>
                <button class="info" onclick="goToTeamSetup()" style="margin-top:12px;">👥 MODE ÉQUIPES</button>
            </div>
        </section>

        <!-- 1.1 CONFIGURATION DES ÉQUIPES -->
        <section id="teamSetupScreen" class="screen">
            <div class="panel">
                <h2>Nommez vos équipes</h2>
                <input type="text" id="team1Name" placeholder="Équipe 1" value="Équipe 1">
                <input type="text" id="team2Name" placeholder="Équipe 2" value="Équipe 2">
                <input type="text" id="team3Name" placeholder="Équipe 3 (optionnel)" style="display:none;">
                <input type="text" id="team4Name" placeholder="Équipe 4 (optionnel)" style="display:none;">
                <input type="text" id="team5Name" placeholder="Équipe 5 (optionnel)" style="display:none;">
                <input type="text" id="team6Name" placeholder="Équipe 6 (optionnel)" style="display:none;">

                <button class="secondary" id="addTeamBtn" onclick="showNextTeamInput()">➕ Ajouter une équipe</button>
                <button onclick="startTeamGame()" class="success" style="margin-top: 15px;">LANCER LE BLIND TEST</button>
                <button class="secondary" onclick="switchScreen('home')">RETOUR</button>
            </div>
        </section>

        <!-- 2. BLIND TEST INTERACTIF -->
        <section id="blindTestScreen" class="screen">
            <div class="panel">
                <h2>🎯 DEVINE LE TITRE / L'ŒUVRE</h2>
                <div id="btPlayingCategory" style="margin-bottom: 15px; font-weight: bold; color: #e50914; text-transform: uppercase;"></div>
                
                <input type="text" id="btUserGuess" placeholder="Tape ton œuvre ici..." autocomplete="off">
                <button onclick="checkBTGuess()">VALIDER LA RÉPONSE</button>

                <!-- Indices -->
                <div class="clues-grid">
                    <button class="info" onclick="showBTFirstLetter()" style="margin-top:0;">💡 1ère lettre</button>
                    <button class="info" onclick="showBTWordCount()" style="margin-top:0;">🔤 Nombre de mots</button>
                    <button class="warning" onclick="showBTThreeLetters()" style="margin-top:0;">🔑 3 premières lettres</button>
                </div>

                <div id="btClues" style="margin-top: 15px; font-weight: bold; color: #f5be32; font-size: 16px; line-height: 1.4;"></div>
                <div id="btFeedback" class="feedback"></div>
            </div>
            <button class="warning" onclick="revealCard()">👀 PASSER / RÉVÉLER</button>
            <button class="secondary" onclick="startRandomBlindTest()">⏭️ MUSIQUE SUIVANTE</button>
        </section>

        <!-- Lecteur Audio HTML5 natif (Remplace YouTube proprement) -->
        <audio id="deezerPlayer" style="display:none;"></audio>

        <!-- 3. RÉVÉLATION & DISTRIBUTION DES POINTS -->
        <section id="revealScreen" class="screen">
            <div class="panel">
                <h2>🎉 RÉVÉLATION</h2>
                <div id="gameTitle" class="game-title"></div>
                <div id="musicTitle" class="music-title"></div>
                <div id="cardCategory" class="card-category"></div>

                <div id="teamPointsSection" style="margin-top: 20px; display:none;">
                    <h3 style="color: #f5be32; font-size: 16px;">Attribution des points :</h3>
                    <div id="teamsScoreList"></div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="success" onclick="startRandomBlindTest()" style="margin-top:0;">▶️ SUIVANTE</button>
                    <button class="warning" onclick="endGame()" style="margin-top:0;">🏁 FIN DE PARTIE</button>
                </div>
            </div>
        </section>

        <!-- 4. CLASSEMENT FINAL -->
        <section id="podiumScreen" class="screen">
            <div class="panel">
                <h2>🏆 RÉSULTATS FINAUX</h2>
                <div id="podiumList" style="margin: 20px 0; font-size: 18px; text-align: left;"></div>
                <button class="success" onclick="switchScreen('home')">REJOUER UNE PARTIE</button>
            </div>
        </section>
    </div>

    <script>
        // Test avec la première musique configurée avec un extrait Deezer direct (.audio)
        const cards = {
            "001": { 
                music: "MIDGAR", 
                game: "Final Fantasy 7", 
                date: "1997", 
                category: "Jeux vidéo", 
                audio: "https://cdns-preview-d.dzcdn.net/stream/c-d41d8cd98f00b204e9800998ecf8427e-3.mp3" 
            }
        };

        let currentCard = null;
        let gameMode = 'solo';
        let teams = [];
        const audioPlayer = document.getElementById('deezerPlayer');

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function setGameMode(mode) {
            gameMode = mode;
            startRandomBlindTest();
        }

        function goToTeamSetup() {
            gameMode = 'teams';
            for (let i = 3; i <= 6; i++) {
                document.getElementById(`team${i}Name`).style.display = 'none';
                document.getElementById(`team${i}Name`).value = '';
            }
            document.getElementById('addTeamBtn').style.display = 'block';
            switchScreen('teamSetupScreen');
        }

        function showNextTeamInput() {
            for (let i = 3; i <= 6; i++) {
                const input = document.getElementById(`team${i}Name`);
                if (input.style.display === 'none') {
                    input.style.display = 'block';
                    input.value = `Équipe ${i}`;
                    if (i === 6) document.getElementById('addTeamBtn').style.display = 'none';
                    break;
                }
            }
        }

        function startTeamGame() {
            teams = [];
            for (let i = 1; i <= 6; i++) {
                const input = document.getElementById(`team${i}Name`);
                if (input && input.style.display !== 'none' && input.value.trim() !== '') {
                    teams.push({ name: input.value.trim(), score: 0 });
                }
            }
            if (teams.length < 2) {
                alert("Il faut au moins 2 équipes !");
                return;
            }
            startRandomBlindTest();
        }

        function startRandomBlindTest() {
            const keys = Object.keys(cards);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            currentCard = cards[randomKey];

            document.getElementById('btUserGuess').value = '';
            document.getElementById('btClues').innerHTML = '';
            document.getElementById('btFeedback').innerHTML = '';
            document.getElementById('btPlayingCategory').innerText = `Catégorie : ${currentCard.category}`;

            switchScreen('blindTestScreen');

            // LECTURE DE L'EXTRAIT AUDIO
            if (currentCard.audio) {
                audioPlayer.src = currentCard.audio;
                audioPlayer.play().catch(error => {
                    console.log("Lecture bloquée par le navigateur, interaction requise", error);
                });
            }
        }

        function stopAudio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }

        function getLevenshteinDistance(a, b) {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function normalizeString(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function checkBTGuess() {
            const userInputValue = document.getElementById('btUserGuess').value;
            const userGuess = normalizeString(userInputValue);
            const targetGame = normalizeString(currentCard.game);
            const targetMusic = normalizeString(currentCard.music);

            const toleranceGame = Math.floor(targetGame.length * 0.4);
            const toleranceMusic = Math.floor(targetMusic.length * 0.4);

            const distanceGame = getLevenshteinDistance(userGuess, targetGame);
            const distanceMusic = getLevenshteinDistance(userGuess, targetMusic);

            const feedbackEl = document.getElementById('btFeedback');

            if (distanceGame <= Math.max(2, toleranceGame) || distanceMusic <= Math.max(2, toleranceMusic)) {
                feedbackEl.style.color = '#28a745';
                feedbackEl.innerText = "✅ BONNE RÉPONSE ! 🎉";
                stopAudio();
                setTimeout(() => revealCard(), 1500);
            } else {
                feedbackEl.style.color = '#e50914';
                feedbackEl.innerText = "❌ Presque... Essaie encore !";
            }
        }

        function showBTFirstLetter() {
            const firstLetter = currentCard.game.charAt(0).toUpperCase();
            document.getElementById('btClues').innerHTML = `💡 Indice : L'œuvre commence par "${firstLetter}"`;
        }

        function showBTWordCount() {
            const wordCount = currentCard.game.trim().split(/\s+/).length;
            document.getElementById('btClues').innerHTML = `🔤 Indice : Le titre comporte <b>${wordCount}</b> mot(s)`;
        }

        function showBTThreeLetters() {
            const cleanGame = currentCard.game.trim();
            const threeLetters = cleanGame.substring(0, 3).toUpperCase();
            document.getElementById('btClues').innerHTML = `🔑 Indice : Les 3 premières lettres sont "${threeLetters}..."`;
        }

        function revealCard() {
            stopAudio();
            document.getElementById('gameTitle').innerText = currentCard.game;
            document.getElementById('musicTitle').innerText = `Morceau : ${currentCard.music}`;
            document.getElementById('cardCategory').innerText = currentCard.category;

            const teamSection = document.getElementById('teamPointsSection');
            const teamsListContainer = document.getElementById('teamsScoreList');
            teamsListContainer.innerHTML = '';

            if (gameMode === 'teams' && teams.length > 0) {
                teamSection.style.display = 'block';
                teams.forEach((team, index) => {
                    teamsListContainer.innerHTML += `
                        <div class="team-score-box">
                            <span><b>${team.name}</b> (${team.score} pts)</span>
                            <div style="display: flex; gap: 5px;">
                                <button class="secondary" style="width: auto; padding: 6px 10px; margin-top:0;" onclick="removePoint(${index})">-</button>
                                <button class="success" style="width: auto; padding: 6px 12px; margin-top:0;" onclick="addPoint(${index})">+1</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                teamSection.style.display = 'none';
            }

            switchScreen('revealScreen');
        }

        function addPoint(index) { teams[index].score += 1; revealCard(); }
        function removePoint(index) { if (teams[index].score > 0) { teams[index].score -= 1; revealCard(); } }

        function endGame() {
            stopAudio();
            if (gameMode === 'solo') { switchScreen('home'); return; }
            teams.sort((a, b) => b.score - a.score);
            const podiumContainer = document.getElementById('podiumList');
            podiumContainer.innerHTML = '';
            teams.forEach((team, index) => {
                let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🎮";
                podiumContainer.innerHTML += `<div style="padding: 8px 0; border-bottom: 1px solid #444;">${medal} <b>${team.name}</b> : ${team.score} point(s)</div>`;
            });
            switchScreen('podiumScreen');
        }
    </script>
</body>
</html>
